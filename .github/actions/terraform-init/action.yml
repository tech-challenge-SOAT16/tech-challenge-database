name: Terraform init na AWS
description: >-
  Configura as credenciais, confere a sessão, cria o bucket do state se ainda
  não existir e roda terraform init no diretório informado.

inputs:
  working-directory:
    description: Diretório do Terraform.
    required: true
  aws-region:
    description: Região AWS.
    required: true
  aws-access-key-id:
    description: Chave da sessão do AWS Academy.
    required: false
  aws-secret-access-key:
    description: Segredo da sessão do AWS Academy.
    required: false
  aws-session-token:
    description: Token da sessão do AWS Academy.
    required: false
  role-to-assume:
    description: Role para OIDC (fora do Academy). Vazio usa as chaves.
    required: false
  state-bucket:
    description: Bucket do state. Vazio usa techchallenge-tfstate-<account-id>.
    required: false

runs:
  using: composite
  steps:
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-region: ${{ inputs.aws-region }}
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-session-token: ${{ inputs.aws-session-token }}
        role-to-assume: ${{ inputs.role-to-assume }}

    - name: Conferir sessão e bucket do state
      shell: bash
      env:
        AWS_REGION: ${{ inputs.aws-region }}
        STATE_BUCKET: ${{ inputs.state-bucket }}
      run: |
        if ! account=$(aws sts get-caller-identity --query Account --output text); then
          echo "::error::Credenciais AWS inválidas ou expiradas. Atualize AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY e AWS_SESSION_TOKEN com a sessão atual do Learner Lab."
          exit 1
        fi
        bucket="${STATE_BUCKET:-techchallenge-tfstate-${account}}"
        if ! aws s3api head-bucket --bucket "$bucket" 2>/dev/null; then
          echo "Criando bucket do state $bucket"
          if [ "$AWS_REGION" = "us-east-1" ]; then
            aws s3api create-bucket --bucket "$bucket"
          else
            aws s3api create-bucket --bucket "$bucket" --create-bucket-configuration "LocationConstraint=$AWS_REGION"
          fi
          aws s3api put-bucket-versioning --bucket "$bucket" --versioning-configuration Status=Enabled
          aws s3api put-public-access-block --bucket "$bucket" \
            --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
        fi
        echo "TF_STATE_BUCKET=$bucket" >> "$GITHUB_ENV"

    - name: terraform init
      shell: bash
      run: >-
        terraform -chdir="${{ inputs.working-directory }}" init -lockfile=readonly
        -backend-config="bucket=$TF_STATE_BUCKET"
        -backend-config="region=${{ inputs.aws-region }}"
